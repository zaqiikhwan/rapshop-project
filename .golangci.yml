version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # unclosed HTTP response / SQL rows
    - misspell
  exclusions:
    rules:
      # QF* are staticcheck "quick-fix" style hints, not correctness issues.
      - linters: [staticcheck]
        text: "QF[0-9]+:"

formatters:
  enable:
    - gofmt
